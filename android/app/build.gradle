plugins {
    id "com.android.application"
}

android {
    namespace "com.gxmotiv.celestia"
    compileSdk 35

    defaultConfig {
        applicationId "com.gxmotiv.celestia"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    // Produce separate APKs for 32-bit and 64-bit ARM phones.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stable release supporting the app's existing minSdk 23.
    implementation "androidx.webkit:webkit:1.15.0"
}
