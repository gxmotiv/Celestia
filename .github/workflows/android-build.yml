name: Celestia Android APKs

on:
  push:
    branches:
      - deploy/cloudflare-workers-free
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM32 and ARM64 APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --licenses < <(yes)
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build split APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both APKs exist
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -s android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -s android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celestia-android-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
