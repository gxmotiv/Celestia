name: Celestia Android APKs

on:
  push:
    branches:
      - deploy/cloudflare-workers-free
      - feat/android-offline-mode
    paths:
      - "android/**"
      - "lib/android/**"
      - "lib/astronomy/**"
      - "lib/vedic/**"
      - "lib/numerology/**"
      - "scripts/testAndroidOfflineSuite.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - deploy/cloudflare-workers-free
    paths:
      - "android/**"
      - "lib/android/**"
      - "lib/astronomy/**"
      - "lib/vedic/**"
      - "lib/numerology/**"
      - "scripts/testAndroidOfflineSuite.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test offline calculations and build ARM APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for the offline calculation bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Verify offline calculation pipeline
        run: npx --yes tsx@4.20.6 scripts/testAndroidOfflineSuite.ts

      - name: Build bundled offline calculation engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/offline
          test -s android/app/src/main/assets/offline/index.html
          npx --yes esbuild@0.25.11 android/offline/offline.ts \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2020 \
            --tsconfig=tsconfig.json \
            --minify \
            --outfile=android/app/src/main/assets/offline/celestia-offline.js
          test -s android/app/src/main/assets/offline/celestia-offline.js
          ls -lh android/app/src/main/assets/offline/celestia-offline.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Install Android SDK packages from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --licenses < <(yes)
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build split APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both APKs exist
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -s android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -s android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celestia-android-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease with both APKs
        if: github.event_name == 'push' && github.ref_name == 'deploy/cloudflare-workers-free'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-v0.1.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Celestia Android v0.1.0 (build ${GITHUB_RUN_NUMBER})" \
            --notes "Celestia Android offline-capable test build.

Online website: https://celestia.gagandeep-hwr.workers.dev/

Offline mode: local Western, Vedic, numerology and BaZi natal calculations and profiles stored on-device.
Online-only: AI readings, live research, external geocoding and cloud features.

ARM64: arm64-v8a
ARM32: armeabi-v7a

This is a debug-signed test build, not a production-signed release." \
            --prerelease \
            --latest=false
