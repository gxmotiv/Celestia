name: Celestia Android APKs

on:
  push:
    branches:
      - deploy/cloudflare-workers-free
      - feat/android-offline-mode
      - fix/celestia-calculation-integrity
    paths:
      - "android/**"
      - "lib/android/**"
      - "lib/astronomy/**"
      - "lib/vedic/**"
      - "lib/numerology/**"
      - "scripts/testAndroidOfflineSuite.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - deploy/cloudflare-workers-free
    paths:
      - "android/**"
      - "lib/android/**"
      - "lib/astronomy/**"
      - "lib/vedic/**"
      - "lib/numerology/**"
      - "scripts/testAndroidOfflineSuite.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test offline calculations and build ARM APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for the offline calculation bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Verify offline calculation pipeline
        run: npx --yes tsx@4.20.6 scripts/testAndroidOfflineSuite.ts

      - name: Build bundled offline calculation engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/offline
          test -s android/app/src/main/assets/offline/index.html
          npx --yes esbuild@0.25.11 android/offline/offline.ts \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2020 \
            --tsconfig=tsconfig.json \
            --minify \
            --outfile=android/app/src/main/assets/offline/celestia-offline.js
          test -s android/app/src/main/assets/offline/celestia-offline.js
          ls -lh android/app/src/main/assets/offline/celestia-offline.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install checksum-verified Gradle 8.14.5 from mirror
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/gradle-8.14.5-bin.zip"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            https://mirror.spaceport.work/gradle/gradle-8.14.5-bin.zip \
            --output "$DIST"
          echo "6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854  $DIST" | sha256sum --check --status
          unzip -q "$DIST" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.5/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.14.5/bin/gradle" --version

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Install Android SDK packages from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --licenses < <(yes)
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build split APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both APKs exist
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -s android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -s android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celestia-android-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease with both APKs
        if: github.event_name == 'push' && (github.ref_name == 'deploy/cloudflare-workers-free' || github.ref_name == 'fix/celestia-calculation-integrity')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_tag="${GITHUB_REF_NAME//\//-}"
          tag="android-v0.2.0-${branch_tag}-build-${GITHUB_RUN_NUMBER}"
          sha256sum android/app/build/outputs/apk/debug/*.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
          gh release create "$tag" \
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            android/app/build/outputs/apk/debug/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Celestia Android v0.2.0 test build (${GITHUB_REF_NAME}, ${GITHUB_RUN_NUMBER})" \
            --notes "Celestia Android offline-capable DEBUG test build from branch ${GITHUB_REF_NAME}. Install as a fresh app if Android reports a signature conflict with an earlier CI build.

Online website: https://celestia.gagandeep-hwr.workers.dev/

Offline mode: local Western, Vedic, numerology and BaZi natal calculations and profiles stored on-device.
Online-only: AI readings, live research, external geocoding and cloud features.

ARM64: arm64-v8a
ARM32: armeabi-v7a

Version 0.2.0 (versionCode 2). This is a debug-signed test build, not a production-signed release. The APKs are generated by GitHub Actions and include SHA256 checksums." \
            --prerelease \
            --latest=false
