name: APInex Celestia Full Model Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model aliases; default runs all 12 configured models"
        required: true
        type: string
        default: "deepseek-v4.1-flash,mimo-v2.6-pro,minimax-m3.1-flash,gemini-4-hydrogen,gemini-3.8-flash,muse-spark-1.3,deepseek-v4-pro,qwen-3.8-max,hy4-flash,kimi-k3,gpt-6-luna,glm-5.3-flash"
      confirm_api_calls:
        description: "Confirm all model × task requests and APInex quota use"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apinex-celestia-full-benchmark
  cancel-in-progress: false

jobs:
  safety-check:
    if: ${{ inputs.confirm_api_calls != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain that no API requests were made
        run: echo "No API requests were made. Re-run manually with confirm_api_calls=true only after reviewing the request count and quota."

  full-benchmark:
    if: ${{ inputs.confirm_api_calls == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python
        run: python3 --version
      - name: Validate benchmark harness
        run: python3 -m unittest discover -s scripts/apinex-benchmark -p 'test_*.py'
      - name: Run selected models across every configured task
        env:
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
        run: |
          python3 scripts/apinex-benchmark/run_all_tasks.py \
            --models "${{ inputs.models }}" \
            --output-dir benchmark-results
      - name: Upload private benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apinex-celestia-full-benchmark-${{ github.run_id }}
          path: benchmark-results/**
          if-no-files-found: warn
          retention-days: 14
