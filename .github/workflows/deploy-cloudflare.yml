name: Celestia Cloudflare Workers

on:
  push:
    branches:
      - deploy/cloudflare-workers-free
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this branch to the Cloudflare account configured in repository secrets"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: celestia-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-build:
    name: OpenNext build and Worker dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary Cloudflare build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest
      - name: Build the Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package the existing Next.js build for Cloudflare
        run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: Set up Bun for the OpenNext deploy command
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check deployment credentials
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy Worker
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the public website responds after deployment
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://celestia.gagandeep-hwr.workers.dev/"
          BODY="$RUNNER_TEMP/celestia-smoke.html"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --max-time 25 "$URL" --output "$BODY"; then
              if grep -Eiq '<html([[:space:]>])' "$BODY"; then
                echo "Celestia website returned an HTML response."
                exit 0
              fi
            fi
            echo "Website smoke check attempt $attempt/10 did not pass; retrying in 6 seconds."
            sleep 6
          done
          echo "The Worker deployment completed, but the public website did not pass the HTTP/HTML smoke check."
          exit 1
