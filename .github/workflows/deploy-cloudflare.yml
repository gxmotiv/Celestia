name: Celestia Cloudflare Workers

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this branch to the Cloudflare account configured in repository secrets"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: celestia-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-build:
    name: OpenNext build and Worker dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary Cloudflare build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest
      - name: Build the Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package the existing Next.js build for Cloudflare
        run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: cloudflare-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary Cloudflare build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest
      - name: Build the Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package the existing Next.js build for Cloudflare
        run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
