name: Celestia Cloudflare Workers

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "docs/vedic/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Run a synthetic-prompt benchmark; zero-priced models only unless allow_paid is enabled"
        required: true
        default: false
        type: boolean
      allow_paid:
        description: "Allow Pollen-consuming requests to non-zero-priced models, including GPT-5 Nano. Keep false for a zero-cost benchmark."
        required: true
        default: false
        type: boolean
      deploy:
        description: "Deploy this branch to the Cloudflare account configured in repository secrets"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: celestia-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-build:
    name: OpenNext build and Worker dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary Cloudflare and TypeScript test tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest tsx
      - name: Run Pollinations catalogue schema regression tests
        run: npx tsx scripts/testPollinationsCatalog.ts
      - name: Run Pollinations response identity regression tests
        run: npx tsx scripts/testPollinationsResponseIdentity.ts
      - name: Run the astrology regression suite
        run: npx tsx scripts/testAstrologySuite.ts
      - name: Build the Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package the existing Next.js build for Cloudflare
        run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run

  pollinations-live-smoke:
    name: Pollinations live free-model inference smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary TypeScript runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund tsx
      - name: Run one guarded live inference only when the API key is configured
        run: |
          if [ -z "$POLLINATIONS_API_KEY" ]; then
            echo "::notice title=Pollinations smoke test skipped::POLLINATIONS_API_KEY is not configured; no inference request was made."
            exit 0
          fi
          npx tsx scripts/benchmarkPollinationsModels.ts --smoke
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

  pollinations-model-benchmark:
    name: Benchmark eligible official Pollinations models (Pollen usage may apply)
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Match the npm version already proven by the build and deploy jobs.
      - name: Use npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary TypeScript runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund tsx
      - name: Verify benchmark runner starts in the repository CommonJS mode
        run: |
          if env -u POLLINATIONS_API_KEY npx tsx scripts/benchmarkPollinationsModels.ts > benchmark-runner-smoke.log 2>&1; then
            echo "Benchmark runner unexpectedly succeeded without its API key"
            exit 1
          fi
          grep -F "POLLINATIONS_API_KEY GitHub secret is not configured." benchmark-runner-smoke.log
      - name: Run guarded synthetic-prompt benchmark
        run: npx tsx scripts/benchmarkPollinationsModels.ts
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_ALLOW_PAID_BENCHMARK: ${{ inputs.allow_paid }}
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pollinations-model-benchmark
          path: pollinations-model-benchmark.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: cloudflare-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install temporary Cloudflare build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest
      - name: Build the Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package the existing Next.js build for Cloudflare
        run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$POLLINATIONS_API_KEY" || { echo "Missing POLLINATIONS_API_KEY repository secret"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync Pollinations key to Cloudflare Worker secret
        run: printf '%s' "$POLLINATIONS_API_KEY" | npx wrangler secret put POLLINATIONS_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
