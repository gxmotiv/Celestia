name: APInex Celestia Multi-Model Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model aliases; default runs all 12 configured models"
        required: true
        type: string
        default: "deepseek-v4.1-flash,qwen-3.8-max,muse-spark-1.3,mimo-v2.6-pro,hy4-flash,minimax-m3.1-flash,gemini-3.8-flash,glm-5.3-flash,kimi-k3,deepseek-v4-pro,gpt-6-luna,gemini-4-hydrogen"
      task:
        description: "Choose one: A calculation; B astrology systems; C numerical fixture; D engineering; E tests; F source audit; G research; H hallucination; I provider identity; J user answer. All models get the same task."
        required: true
        type: choice
        default: A
        options: [A, B, C, D, E, F, G, H, I, J, ALL]
      confirm_api_call:
        description: "Required: one task = up to 12 requests; ALL = 120 first-pass requests in ten controlled batches."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apinex-celestia-benchmark
  cancel-in-progress: false

jobs:
  safety-check:
    if: ${{ inputs.confirm_api_call != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain that no API requests were made
        run: echo "No API requests were made. Re-run manually and set confirm_api_call=true when ready."

  benchmark-selected-models:
    if: ${{ inputs.confirm_api_call == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python
        run: python3 --version
      - name: Compile benchmark Python scripts
        run: python3 -m py_compile scripts/apinex-benchmark/*.py scripts/apinex-benchmark/tests/*.py
      - name: Validate benchmark JSON schemas and scoring guards
        run: python3 -m unittest discover -s scripts/apinex-benchmark/tests -v
      - name: Validate ten atomic tasks and routing checks
        run: python3 -m unittest discover -s scripts/apinex-benchmark -p 'test_benchmark_v2.py' -v
      - name: Run all selected models concurrently on the one selected task
        env:
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          BENCHMARK_MODELS: ${{ inputs.models }}
          BENCHMARK_TASK: ${{ inputs.task }}
        run: |
          if [ "$BENCHMARK_TASK" = "ALL" ]; then
            python3 scripts/apinex-benchmark/run_all_tasks.py \
              --models "$BENCHMARK_MODELS" \
              --confirm-all \
              --concurrency 12 \
              --output-dir benchmark-results
          else
            python3 scripts/apinex-benchmark/run_batch.py \
              --models "$BENCHMARK_MODELS" \
              --task "$BENCHMARK_TASK" \
              --concurrency 12 \
              --output-dir benchmark-results
          fi
      - name: Upload individual JSON and task summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apinex-celestia-task-${{ inputs.task }}-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14
