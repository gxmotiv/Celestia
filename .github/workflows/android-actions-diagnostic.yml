name: Celestia Android APK Build

on:
  push:
    branches:
      - diagnose/android-actions-runner

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build ARM32 and ARM64 APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build split APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both APKs exist
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -f android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -f android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celestia-android-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
