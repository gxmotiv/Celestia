name: Android Actions Setup Java Test

on:
  push:
    branches:
      - diagnose/android-actions-runner

permissions:
  contents: read

jobs:
  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: java -version
