name: Celestia verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: celestia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: Test suite (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - testAstrologySuite.ts
          - testBaZiSuite.ts
          - testGeocodeSuite.ts
          - testMinorAspectsSuite.ts
          - testNavamsaSuite.ts
          - testNumerologySuite.ts
          - testRelationshipChartsSuite.ts
          - testUtcJulianDaySuite.ts
          - testVedicTimezoneSuite.ts
          - testVimshottariAntardashaSuite.ts
          - testHistoricalTimezoneSuite.ts
          - testTimeInputSuite.ts
          - testBaZiTimeEngineSuite.ts
          - testSolarTermsSolverSuite.ts
          - testBaZiSolarPillarsSuite.ts
          - testBaZiProfileAdapterSuite.ts
          - testLunarNodeConsistencySuite.ts
          - testAyanamsaConsistencySuite.ts
          - testTransitAspectDirectionSuite.ts
          - testPlanetaryHoursSuite.ts
          - testDashaExpiredPeriodSuite.ts
          - testAndroidOfflineSuite.ts
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun from npm
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Run ${{ matrix.script }}
        run: bun run scripts/${{ matrix.script }}
        env:
          CI: "true"


  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun from npm
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint
        env:
          CI: "true"

  android-apks:
    name: Offline Android APK build (ARM32 + ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Bundle offline calculation engine
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/offline
          test -s android/app/src/main/assets/offline/index.html
          npx --yes esbuild@0.25.11 android/offline/offline.ts --bundle --platform=browser --format=iife --target=es2020 --tsconfig=tsconfig.json --minify --outfile=android/app/src/main/assets/offline/celestia-offline.js
          test -s android/app/src/main/assets/offline/celestia-offline.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Gradle 8.9 with retries
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/gradle-8.9-bin.zip"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$DIST"
          unzip -q "$DIST" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --licenses < <(yes)
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build ARM32 and ARM64 APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK outputs
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -s android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          ls -lh android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celestia-android-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun from npm
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
