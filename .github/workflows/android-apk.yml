name: Celestia Android APKs

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - feat/android-apk-wrapper
      - deploy/cloudflare-workers-free
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the APK files (test/debug-signed build)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: celestia-android-apks
  cancel-in-progress: false

jobs:
  build:
    name: Build ARM32 and ARM64 APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build split APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both APKs exist
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -f android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -f android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celestia-android-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.0-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Celestia Android v0.1.0 (build ${{ github.run_number }})
          body: |
            Celestia Android WebView wrapper for:
            https://celestia.gagandeep-hwr.workers.dev/

            Test build signed with the Android debug certificate. Do not treat this as a production signing setup.
            ARM64: arm64-v8a
            ARM32: armeabi-v7a
          files: android/app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
