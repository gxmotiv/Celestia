name: Celestia PR #112 isolated preview

on:
  push:
    branches:
      - preview/celestia-pr112-isolated

permissions:
  contents: read

concurrency:
  group: celestia-pr112-isolated-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    name: Build and deploy isolated preview Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun for OpenNext Cloudflare deployment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pin npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install temporary Cloudflare build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest

      - name: Run provider identity and privacy regression tests
        run: |
          npx tsx scripts/testPollinationsResponseIdentity.ts
          npx tsx scripts/testAIProviderErrors.ts
          npx tsx scripts/testAIConsentRoutes.ts

      - name: Run astrology regression suite
        run: npx tsx scripts/testAstrologySuite.ts

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package OpenNext Worker
        run: npx opennextjs-cloudflare build --skipNextBuild

      - name: Verify Cloudflare credentials exist without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy only the isolated preview Worker
        run: npx wrangler deploy --name celestia-pr112-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
