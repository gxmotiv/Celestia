name: Celestia PR #112 isolated preview

on:
  push:
    branches:
      - preview/celestia-pr112-isolated

permissions:
  contents: read

concurrency:
  group: celestia-pr112-isolated-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    name: Build and deploy isolated preview Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun for OpenNext Cloudflare deployment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pin npm version compatible with the committed lockfile
        run: npm install --global npm@10.9.9

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install temporary Cloudflare build tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@latest wrangler@latest

      - name: Run provider identity and privacy regression tests
        run: |
          npx tsx scripts/testPollinationsResponseIdentity.ts
          npx tsx scripts/testAIProviderErrors.ts
          npx tsx scripts/testAIConsentRoutes.ts

      - name: Run astrology regression suite
        run: npx tsx scripts/testAstrologySuite.ts

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package OpenNext Worker
        run: npx opennextjs-cloudflare build --skipNextBuild

      - name: Verify Cloudflare credentials exist without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy only the isolated preview Worker
        run: npx wrangler deploy --name celestia-pr112-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test deployed website and AI provider availability
        run: |
          node --input-type=module <<'NODE'
          const base = "https://celestia-pr112-preview.gagandeep-hwr.workers.dev";
          const home = await fetch(base, { redirect: "follow" });
          if (!home.ok) throw new Error(`Homepage failed: HTTP ${home.status}`);
          const html = await home.text();
          if (!html.includes("<html") && !html.includes("<!DOCTYPE")) throw new Error("Homepage did not return HTML");
          console.log(`PASS homepage: HTTP ${home.status}, ${html.length} characters`);

          const response = await fetch(base + "/api/astrology/ai-providers", { cache: "no-store" });
          if (!response.ok) throw new Error(`AI provider status route failed: HTTP ${response.status}`);
          const payload = await response.json();
          if (payload?.providers?.["cloudflare-workers-ai"] !== true) {
            throw new Error("Cloudflare Workers AI is not enabled in the deployed preview: " + JSON.stringify(payload?.providers ?? {}));
          }
          console.log("PASS AI provider status: Cloudflare Workers AI binding and Free-plan gate are enabled");

          // Inspect NaraRouter from the isolated preview without exposing credentials.
          const naraResponse = await fetch(base + "/api/astrology/nararouter-models", { cache: "no-store" });
          const nara = await naraResponse.json();
          if (nara.configured && naraResponse.ok) {
            console.log("NaraRouter configured; verified Free models: " + (nara.models ?? []).map((m) => m.id).join(", "));
          } else if (!nara.configured) {
            console.log("NaraRouter not configured in preview (no preview-only API secret); live model test skipped.");
          } else {
            console.log("NaraRouter model discovery returned HTTP " + naraResponse.status + "; safe error: " + (nara.error ?? "unknown"));
          }

          // One tiny, anonymous, non-chart inference proves the real route works.
          // Workers Free has a shared daily 10,000-Neuron cap; above it Cloudflare
          // rejects requests with 429 rather than charging the Free account.
          const inference = await fetch(base + "/api/astrology/ai-reading", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              externalDataConsent: true,
              model: "cloudflare-workers-ai:@cf/qwen/qwen3.8-27b",
              readingLength: "concise",
              userQuestion: "Reply with exactly: CELESTIA_PREVIEW_AI_OK",
              western: {},
              vedic: {},
              numerology: {},
              chinese: {}
            })
          });
          const result = await inference.json();
          if (!inference.ok || result?.success !== true || typeof result?.reading !== "string" || !result.reading.trim()) {
            throw new Error("Live AI inference failed: HTTP " + inference.status + " " + JSON.stringify(result));
          }
          if (result.provider !== "cloudflare-workers-ai" || result.model !== "@cf/qwen/qwen3.8-27b") {
            throw new Error("Live AI inference returned unexpected provider/model: " + JSON.stringify({provider: result.provider, model: result.model}));
          }
          console.log("PASS live AI inference: Cloudflare Workers AI / Qwen 3.8 27B returned assistant text; no personal chart data was sent.");
          console.log("AI smoke response: " + result.reading.slice(0, 180).replace(/\\s+/g, " "));
          NODE
