name: Western INPOP independent reference capture

on:
  push:
    branches:
      - research/jpl-western-ephemeris-benchmarks
    paths:
      - .github/workflows/inpop-reference-capture.yml
      - scripts/fetchInpopWesternEphemerisReference.ts
      - scripts/compareInpopWesternEphemeris.ts
      - lib/astronomy/inpopWesternEphemerisBenchmarks.ts
      - data/benchmarks/western-ephemeris-reference.json

permissions:
  contents: write

concurrency:
  group: western-inpop-reference-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture or verify IMCCE INPOP reference responses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun
        run: |
          npm install --global bun@1.4.4
          test "$(bun --version)" = "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate INPOP parser and diagnostic fit
        run: bun run scripts/testInpopWesternEphemerisHarness.ts
      - name: Capture IMCCE data only when the committed dataset is absent
        run: |
          if [ ! -s data/benchmarks/inpop-western-ephemeris-reference.json ]; then
            bun run scripts/fetchInpopWesternEphemerisReference.ts --fetch
          else
            echo "Using committed INPOP capture; live recapture requires the explicit --overwrite command."
          fi
      - name: Verify raw checksums and compare Astronomy Engine, INPOP and JPL
        run: bun run scripts/compareInpopWesternEphemeris.ts
      - name: Upload source responses and normalized fixtures
        uses: actions/upload-artifact@v4
        with:
          name: western-imcce-inpop-reference-${{ github.sha }}
          path: |
            data/benchmarks/inpop-western-ephemeris-reference.json
            data/benchmarks/inpop-raw/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit captured INPOP data to the isolated benchmark branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks/inpop-western-ephemeris-reference.json data/benchmarks/inpop-raw/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Capture independent IMCCE INPOP outer-planet references"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
